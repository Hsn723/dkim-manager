name: release
on:
  push:
    branches:
      - master
    paths:
      - VERSION
permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write
  pull-requests: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/release.yml@c50290a364a03bbea5489416c230ffd60e1dbbe8 # v1.0.53
    secrets: inherit
    with:
      upload-image-sbom: false
      chart_name: dkim-manager
