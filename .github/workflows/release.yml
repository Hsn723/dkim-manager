  contents: write
  id-token: write
  packages: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/release.yml@acb91ada80e04ac6cf812df86a9f3090a77d86b7 # v1.0.52
    secrets: inherit
    with:
      upload-image-sbom: false
