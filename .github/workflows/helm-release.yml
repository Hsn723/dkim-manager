name: Release Helm chart
on:
  push:
    branches:
      - master
    paths:
      - 'charts/dkim-manager/Chart.yaml'
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/helm-release.yml@3a9e9ad4bbf7fa37f2b1ac810d5d0c9cd06ebc63 # v1.0.48
    secrets: inherit
    with:
      extra_helm_setup: |
        helm repo add external-dns https://kubernetes-sigs.github.io/external-dns
        helm repo update
      upload_as_oci: true
      chart_name: dkim-manager
