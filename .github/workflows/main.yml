name: main
on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - master
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write
jobs:
  verify:
    uses: hsn723/actions/.github/workflows/verify.yml@ff0eb24529ec1fa062dca834a74a7a37738d7ce1 # v1.0.43
    secrets: inherit
