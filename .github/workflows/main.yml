name: main
on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - master
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write
jobs:
  verify:
    uses: hsn723/actions/.github/workflows/verify.yml@c50290a364a03bbea5489416c230ffd60e1dbbe8 # v1.0.53
    secrets: inherit
