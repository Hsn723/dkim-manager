name: main
on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - master
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write
jobs:
  verify:
    uses: hsn723/actions/.github/workflows/verify.yml@bd05ba2349bb5069aa84e061397f491ef75ffe4e # v1.0.49
    secrets: inherit
