name: main
on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - master
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write
jobs:
  verify:
    uses: hsn723/actions/.github/workflows/verify.yml@acb91ada80e04ac6cf812df86a9f3090a77d86b7 # v1.0.52
    secrets: inherit
